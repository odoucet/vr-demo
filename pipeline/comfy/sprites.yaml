# Familles de sprites peints (pipeline/comfy/sprites.py) : images générées en local (Z-Image Turbo), détourées
# (BiRefNet), assemblées en atlas assets/textures/sprite_<famille>.png, posées dans la scène par
# pipeline/layout/vegetation.py et pipeline/unreal/scripts/greybox.py.
#
# type : gabarit de prompt (PROMPTS ci-dessous) ; cell : taille d'une case de l'atlas [l, h] ; grid : [colonnes,
# lignes] ; size : image générée [l, h] ; seed : graine de la première image (+1 par image) ; items : [nom, sujet,
# options] (options : drop: green = retirer la végétation ajoutée derrière un animal ; crown: true = garder le houppier
# seul ; seed: graine propre à l'image).
# Le nom de fichier de chaque image est <famille>_<n>.png (identifiant d'asset).

prompts:
  tree: >-
    single isolated tree, the whole tree visible from the base of the trunk to the top of the crown, {kind}, lit by
    soft warm dusk light from the left, darker cool shadow side, centered, plain flat light grey background, no ground,
    no grass, no shadow on the ground, hand-painted, {style}
  plant: >-
    single isolated {kind}, the whole plant visible from its base to its top, lit by soft warm dusk light from the
    left, centered, plain flat light grey background, no ground, no shadow, nothing else in the image, hand-painted,
    {style}
  strip: >-
    wide panoramic band of {kind}, seen from far away across a river, flat silhouette band whose bottom edge is a
    straight ground line, filling the whole width, empty plain flat pale grey sky behind with no clouds at all,
    hand-painted, {style}
  foliage: >-
    single isolated dense mass of leaves, {kind}, round painted clump of foliage with no trunk and no branches visible,
    lit from above, plain flat light grey background, hand-painted, {style}
  top: >-
    {kind}, seen from directly above, isolated on an empty plain flat light grey background, nothing else in the image,
    hand-painted, {style}
  small: >-
    single isolated {kind}, centered, plain flat light grey background, nothing else in the image, no plants,
    hand-painted, {style}

