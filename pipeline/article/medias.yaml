# Diaporamas MetaSlider (demande d'Olivier, 30/10 : les comparaisons « côte à côte », en plus grand) : une image par
# diapositive, 1600×900, légende incrustée (compositions.py), publiées dans article/diaporamas/<nom>/. Dans l'article,
# [metaslider id="REMPLACER-<nom>"] marque leur place, à remplacer par le code court donné par MetaSlider.
diaporamas:
  barque-13-arbres-abc:    {src: builds/article/diaporamas/barque-13-arbres-abc, largeur: 1600, qualite: 85}
  barque-20-pont-versions: {src: builds/article/diaporamas/barque-20-pont-versions, largeur: 1600, qualite: 85}
