# Paysage sonore de la démo : placement des sons retenus (audio/sfx/) dans la séquence LS_Animatic.
# Temps en secondes de démo. attach : acteur auquel le son est attaché (spatialisé, mono), sinon son 2D.
# Les repères des créatures précèdent leur apparition de 2-3 s et viennent de leur direction (CLAUDE.md).
# Provisoire : volumes et plages à régler à l'écoute (sons choisis sans écoute, SUIVI.md D7).

