  - {id: sfx-roseaux,       start: 30,    end: 46,  volume: 0.4, fade_in: 2, fade_out: 3}
  - {id: amb-riviere-foret, start: 44,    end: 132, volume: 0.6, fade_in: 6, fade_out: 6}
