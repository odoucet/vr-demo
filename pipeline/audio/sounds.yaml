# Besoins sonores couverts par Freesound (ambiances et bruitages de décor).
# Les repères sonores des créatures (2-3 s avant l'apparition) sont traités à part : génération locale.
# licence : cc0 (défaut) ou cc0+ccby (CC-BY toléré, crédit obligatoire dans le manifeste).

candidates: 4          # nombre de candidats par besoin
max_duration: 300      # au-delà, téléchargement lourd pour rien (boucler en jeu)
# Requêtes courtes : Freesound exige tous les mots, une phrase longue ne trouve rien.
sounds:
  - id: amb-clapotis
    beats: [S1-NOIR, S2-PONTON]
    query: water lapping boat
    min_duration: 30
  - id: amb-ponton-brume
    beats: [S2-PONTON]
    query: lake morning birds
    min_duration: 60
  - id: sfx-roseaux
    beats: [S2-PONTON]
    query: reeds rustling
    min_duration: 3
  - id: amb-riviere-foret
    beats: [S3-ABYSSE, S4-GUE]
    query: forest river birds
    min_duration: 60
  - id: sfx-gue-eau
    beats: [S4-GUE]
    query: wading water
    min_duration: 5
  - id: amb-sous-racines
    beats: [S5-RACINES]
    query: cave drips
    min_duration: 30
  - id: amb-foret-nuit
    beats: [S6-LUNE]
    query: night crickets frogs
    min_duration: 60
  - id: amb-lac-nuit
    beats: [S7-LAC]
    query: lake night crickets
    min_duration: 60
    debut_s: 35         # voix (tournage) dans les 30 premières secondes de l'enregistrement : détectées par Whisper
  - id: sfx-barque-bois
    beats: [all]
    query: boat creak wood
    min_duration: 3
  # Repères sonores des créatures (2-3 s avant l'apparition, depuis leur direction) : substituts Freesound
  # en attendant une génération dédiée.
  - id: cue-abysses
    beats: [S3-ABYSSE]
    query: underwater whale
    min_duration: 3
  - id: cue-troupeau
    beats: [S4-GUE]
    query: large animal breathing
    min_duration: 2
  - id: cue-volante
    beats: [S6-LUNE]
    query: whale song
    min_duration: 4
  # Faune posée et animée (sprites, 19/10) : sons ponctuels spatialisés à sa place (sprites_layout.py, « sons »).
  - id: sfx-canards
    beats: [S2-PONTON, S3-ABYSSE, S7-LAC]
    query: ducks quacking pond
    min_duration: 8
  - id: sfx-grenouilles
    beats: [S3-ABYSSE]
    query: frogs croaking
    min_duration: 10
  - id: sfx-chouette
    beats: [S6-LUNE]
    query: owl hooting
    min_duration: 4
  # Héron du final (20/10) : cri au loin pour guider le regard, puis battements d'ailes en se posant sur le rebord.
  - id: cue-heron
    beats: [S7-LAC]
    query: egret  # 541377 « Great egret » : cris rauques de 0 à 8 s (analysés, non écoutés)
    min_duration: 1
  - id: sfx-heron-ailes
    beats: [S7-LAC]
    query: bird wings flapping
    min_duration: 1
    debut_s: 13.4      # 753219 : battements réguliers (~0,6 s) de 13,6 à 25 s, avant : silence et un choc
