# Ambiance par beat (réglages d'Olivier ou de l'agent ; les couleurs de brume sont mesurées sur les références).
# pipeline/style/ambiance.py → pipeline/style/ambiance.json, lu tel quel par le temps réel (Unreal) et le rendu
# offline du lointain : la brume sert de raccord proche / lointain, sa couleur doit être identique des deux côtés.
#
# luminance : luminance linéaire de la brume (la teinte vient de la référence du beat).
# densite   : densité de l'ExponentialHeightFog (Unreal), à reprendre à l'identique dans le rendu offline.
# saturation: atténuation de la teinte mesurée (commune à tous les beats).
# Densités choisies sur essais (2026-10-18, review/iter-006) : 0,03-0,06 étage les silhouettes en plans successifs.
# Valeurs de nuit réglées sur captures sans courbe filmique (comme le Quest), review/iter-008.
# fondu_s   : durée du fondu depuis le beat précédent, centré sur le début du beat.
#
# Look peint (matériau M_Peint, deux tons) — multiplicateurs linéaires de la couleur propre (look.yaml) :
# lumiere   : face éclairée (chaude au crépuscule, froide au clair de lune).
# ombre     : face à l'ombre (bleu-violet froid, jamais noir : aplats lisibles).
# ciel      : lumière d'appoint venue du ciel sur les faces tournées vers le haut.
# ciel_teinte : multiplicateur du ciel peint et de son reflet dans l'eau (la nuit bleuit et assombrit le ciel).
# soleil    : direction de la lumière, [cap relatif, élévation] en degrés ; cap relatif 0 = droit devant la
#             barque au début du beat, 90 = à gauche, 180 = derrière. Contre-jour (devant) = silhouettes
#             bordées de lumière, comme dans S2/S7 ; lumière de côté = volumes.

fondu_s: 12
saturation: 0.6     # 1 = teinte mesurée telle quelle, 0 = gris
beats:
  S1-NOIR:    {luminance: 0.02, densite: 0.080, lumiere: [0.20, 0.24, 0.36], ombre: [0.06, 0.08, 0.14], ciel: [0.03, 0.04, 0.08], ciel_teinte: [0.05, 0.06, 0.10], soleil: [20, 12]}
  S2-PONTON:  {luminance: 0.10, densite: 0.200, lumiere: [0.45, 0.55, 0.75], ombre: [0.12, 0.17, 0.30], ciel: [0.06, 0.09, 0.16], ciel_teinte: [0.60, 0.70, 0.86], soleil: [25, 10]}   # départ dans la vraie brume (essai ×20, review/iter-006)
  S3-ABYSSE:  {luminance: 0.11, densite: 0.045, lumiere: [1.00, 0.98, 0.88], ombre: [0.26, 0.34, 0.50], ciel: [0.10, 0.14, 0.20], ciel_teinte: [0.90, 0.92, 0.95], soleil: [60, 16]}
  S4-GUE:     {luminance: 0.12, densite: 0.045, lumiere: [1.25, 1.02, 0.72], ombre: [0.30, 0.34, 0.56], ciel: [0.12, 0.13, 0.20], ciel_teinte: [1.00, 0.92, 0.85], soleil: [110, 14]}
  S5-RACINES: {luminance: 0.05, densite: 0.060, lumiere: [0.95, 0.72, 0.38], ombre: [0.17, 0.21, 0.23], ciel: [0.10, 0.11, 0.12], ciel_teinte: [0.70, 0.55, 0.45], soleil: [15, 9]}
  S6-LUNE:    {luminance: 0.02, densite: 0.030, lumiere: [0.16, 0.26, 0.30], ombre: [0.02, 0.04, 0.055], ciel: [0.012, 0.025, 0.03], ciel_teinte: [0.09, 0.13, 0.16], soleil: [15, 30]}   # trouée : ciel et lune dégagés ; la lune éclaire
  S7-LAC:     {luminance: 0.02, densite: 0.035, lumiere: [0.13, 0.16, 0.30], ombre: [0.02, 0.025, 0.06], ciel: [0.015, 0.02, 0.04], ciel_teinte: [0.06, 0.07, 0.13], soleil: [0, 25]}
